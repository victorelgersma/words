{{ define "main" }}
<section class="contents">
  <h1 class="list-title">{{ .Title }}</h1>
  <ol class="toc">
    {{ range .Pages }}
    <li>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      {{ if not .Date.IsZero }}<time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time>{{ end }}
    </li>
    {{ end }}
  </ol>
</section>
{{ end }}
